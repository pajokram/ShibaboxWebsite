<main
  #page
  class="relative z-10 grid min-h-dvh w-full place-items-center overflow-x-hidden p-4 font-sans text-shiba-brown sm:p-6"
>
  <article
    class="profile-card relative w-full max-w-lg rounded-3xl bg-shiba-card p-5 shadow-xl ring-1 ring-shiba-sand/25 sm:p-8"
  >
    <div
      class="absolute right-4 top-4 z-10 flex rounded-full bg-shiba-cream p-1 shadow-sm ring-1 ring-shiba-sand/35 sm:right-6 sm:top-6"
      role="group"
      [attr.aria-label]="copy().languageLabel"
      data-reveal
    >
      <button
        type="button"
        class="min-h-9 min-w-10 rounded-full px-2.5 py-1 text-[0.65rem] font-bold text-shiba-brown transition-colors duration-200 hover:bg-shiba-honey/35 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-shiba-brown"
        [class]="language() === 'de' ? 'bg-shiba-brown text-shiba-card shadow-sm' : ''"
        [attr.aria-pressed]="language() === 'de'"
        (click)="setLanguage('de')"
      >
        DE
      </button>
      <button
        type="button"
        class="min-h-9 min-w-10 rounded-full px-2.5 py-1 text-[0.65rem] font-bold text-shiba-brown transition-colors duration-200 hover:bg-shiba-honey/35 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-shiba-brown"
        [class]="language() === 'en' ? 'bg-shiba-brown text-shiba-card shadow-sm' : ''"
        [attr.aria-pressed]="language() === 'en'"
        (click)="setLanguage('en')"
      >
        EN
      </button>
    </div>

    <header class="flex justify-center" data-reveal>
      <img
        src="/shibabox-logo.png"
        alt="Shibabox"
        class="h-[26dvh] min-h-24 w-auto max-w-full max-sm:max-h-40 sm:max-h-56"
      />
    </header>

    <nav class="mt-4 flex flex-col gap-2.5 sm:mt-5" aria-label="Shibabox links" data-reveal>
      @for (link of links; track link.key) {
        <a
          class="group flex h-14 w-full items-center gap-3 rounded-2xl px-4 no-underline shadow-sm transition duration-200 hover:-translate-y-0.5 hover:shadow-md active:translate-y-0 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-shiba-brown sm:h-16 sm:gap-4 sm:px-5"
          [class]="link.colors"
          [href]="link.href"
          target="_blank"
          rel="noopener noreferrer"
        >
          <img
            [src]="link.icon"
            alt=""
            class="size-6 shrink-0 sm:size-7"
            aria-hidden="true"
          />
          <span
            class="language-copy min-w-0 flex-1 text-[0.95rem] font-black leading-tight sm:text-base"
          >
            {{ link.label[language()] }}
          </span>
          <span
            class="text-lg opacity-60 transition-transform duration-200 group-hover:translate-x-0.5 sm:text-xl"
            aria-hidden="true"
          >
            ↗
          </span>
        </a>
      }
    </nav>
  </article>
</main>
