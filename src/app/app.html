<main
  #page
  class="flex h-[100svh] w-full items-center justify-center overflow-hidden bg-transparent p-3 font-sans sm:p-5"
>
  <article
    class="profile-card relative w-full max-w-[420px] overflow-hidden rounded-[1.75rem] bg-[#fff4d6] p-4 shadow-[0_24px_70px_rgba(74,42,24,0.3)] ring-1 ring-black/5 sm:p-5"
  >
    <div
      class="absolute right-4 top-4 z-10 flex rounded-full bg-[#f2b705]/25 p-1 sm:right-5 sm:top-5"
      role="group"
      [attr.aria-label]="copy().languageLabel"
      data-reveal
    >
      <button
        type="button"
        class="rounded-full px-2.5 py-1 text-[0.65rem] font-bold text-[#4a2a18] transition-colors focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-[#4a2a18]"
        [class]="language() === 'de' ? 'bg-[#4a2a18] text-[#fff4d6]' : ''"
        [attr.aria-pressed]="language() === 'de'"
        (click)="setLanguage('de')"
      >
        DE
      </button>
      <button
        type="button"
        class="rounded-full px-2.5 py-1 text-[0.65rem] font-bold text-[#4a2a18] transition-colors focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-[#4a2a18]"
        [class]="language() === 'en' ? 'bg-[#4a2a18] text-[#fff4d6]' : ''"
        [attr.aria-pressed]="language() === 'en'"
        (click)="setLanguage('en')"
      >
        EN
      </button>
    </div>

    <header class="flex justify-center" data-reveal>
      <img
        src="/shibabox-logo.png"
        alt="Shibabox"
        class="h-auto w-[150px] select-none sm:w-[170px]"
      />
    </header>

    <nav class="mt-3 flex flex-col gap-2.5" aria-label="Shibabox links" data-reveal>
      @for (link of links; track link.key) {
        <a
          class="group flex min-h-[58px] w-full items-center gap-3 rounded-2xl px-3 py-2.5 no-underline shadow-sm transition duration-200 hover:-translate-y-0.5 hover:shadow-md focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-[#4a2a18]"
          [class]="link.colors"
          [href]="link.href"
          target="_blank"
          rel="noopener noreferrer"
        >
          <img [src]="link.icon" alt="" class="size-6 shrink-0" aria-hidden="true" />
          <span class="language-copy min-w-0 flex-1 text-[0.95rem] font-black leading-tight">
            {{ link.label[language()] }}
          </span>
          <span
            class="text-lg opacity-60 transition-transform group-hover:translate-x-0.5"
            aria-hidden="true"
          >
            ↗
          </span>
        </a>
      }
    </nav>
  </article>
</main>
