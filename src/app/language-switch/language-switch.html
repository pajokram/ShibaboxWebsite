<div
  class="absolute right-[5%] top-[4%] z-10 grid grid-cols-2 rounded-lg bg-shiba-cream p-1 shadow-sm ring-1 ring-shiba-sand/35"
  role="group"
  [attr.aria-label]="label()"
  data-reveal
>
  <span
    class="pointer-events-none absolute left-1 top-1 h-8 w-9 rounded-md bg-shiba-brown shadow-sm transition-transform duration-300 ease-out motion-reduce:transition-none"
    [class]="language() === 'en' ? 'translate-x-9' : 'translate-x-0'"
    aria-hidden="true"
  ></span>
  @for (option of options; track option) {
    <button
      type="button"
      class="relative z-10 h-8 w-9 rounded-md text-[0.6875rem] font-medium uppercase tracking-wider transition-colors duration-300 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-shiba-brown"
      [class]="
        language() === option ? 'text-shiba-card' : 'text-shiba-brown/55 hover:text-shiba-brown'
      "
      [attr.aria-pressed]="language() === option"
      (click)="select(option)"
    >
      {{ option }}
    </button>
  }
</div>
